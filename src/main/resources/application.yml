spring:
  application:
    name: streak-reminder-service

logging:
  level:
    root: INFO
    com.streakreminder: DEBUG

firebase:
  project-id: streak-checker
  service-account-file-path: classpath:firebase-service-account.json

scheduler:
  enabled: true
  poll-interval-seconds: 60
  cron-expression: "0 * * * * *"
  task-reminder-grace-seconds: 120
